# New-API Docker Compose Configuration (Host MySQL + Local Build)
# 
# Uses existing host MySQL at port 13306 instead of Docker mysql service.

services:
  new-api:
    build: .
    image: new-api-new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    environment:
      - SQL_DSN=root:rAFZtETi3jebacKC@tcp(172.17.0.1:13306)/newapi
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - UPLOADS_PUBLIC_URL=https://heharse.cloud/uploads/
#      - STREAMING_TIMEOUT=300
#      - SESSION_SECRET=random_string
#      - SYNC_FREQUENCY=60
      - GOOGLE_ANALYTICS_ID=G-PG3KCCKN33
#      - DEEPLX_URL=http://deeplx:1188/translate
#      - DEEPLX_TOKEN=${DEEPLX_TOKEN:-changeme}
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js

    depends_on:
      - redis
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
