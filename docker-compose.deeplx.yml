# DeepLX 独立部署配置
# 与主服务解耦，可独立重启/更新/扩缩容
# 通过共享 Docker 网络与 new-api 后端通信
#
# 前置条件：
#   docker network create new-api-network
#
# 启动命令：
#   docker compose -f docker-compose.deeplx.yml up -d
#
# 跨机器部署说明：
#   若 DeepLX 部署在另一台服务器，请将 DEEPLX_URL 改为对应地址，
#   并删除下方 ports 和 networks 配置。

services:
  deeplx:
    image: ghcr.io/owo-network/deeplx:latest
    container_name: deeplx
    restart: always
    # 本地开发或调试时可访问；生产环境建议仅走后端代理
    ports:
      - "127.0.0.1:1188:1188"
    environment:
      - TOKEN=${DEEPLX_TOKEN:-changeme}
    networks:
      - new-api-network

networks:
  new-api-network:
    external: true
