<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Collector - 侧边栏</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🎯 提示词采集器</h1>
      <p class="subtitle">批量采集，一键提交</p>
    </div>

    <!-- 配置面板（可折叠） -->
    <div class="config-section">
      <div class="config-toggle" id="configToggle">
        <span>⚙️ API 配置</span>
        <span class="arrow">▶</span>
      </div>
      <div class="config-body" id="configBody" style="display:none;">
        <div class="field">
          <label>API Base URL</label>
          <input type="text" id="apiBaseUrl" placeholder="https://your-domain.com/api">
        </div>
        <div class="field">
          <label>Admin JWT Token</label>
          <div style="display:flex;gap:6px;">
            <input type="password" id="apiToken" placeholder="Bearer xxx..." style="flex:1;">
            <button id="fetchTokenBtn" type="button" style="padding:7px 9px;font-size:11px;font-weight:600;color:#fff;background:#6366f1;border:none;border-radius:7px;cursor:pointer;white-space:nowrap;">🔄 获取</button>
          </div>
        </div>
        <div class="field">
          <label>用户 ID（New-API-User）</label>
          <input type="number" id="userId" placeholder="如: 1">
        </div>
        <div class="field">
          <label>默认分类 ID（可选）</label>
          <input type="number" id="defaultCategoryId" placeholder="1">
        </div>
        <div class="field checkbox-field">
          <label class="checkbox-label">
            <input type="checkbox" id="autoSubmit">
            <span>采集后自动提交到后台（无需手动点提交）</span>
          </label>
        </div>
        <div class="field">
          <label>模型→分类映射（可选）</label>
          <textarea id="categoryMapping" placeholder="每行一个映射，格式：模型名=分类ID&#10;例：&#10;Nano banana pro=2&#10;ChatGPT=1&#10;Midjourney=3" rows="4"></textarea>
          <div class="field-hint">不填则自动按名称匹配分类</div>
        </div>
        <button class="btn btn-secondary" id="saveConfigBtn">保存配置</button>
        <div class="status" id="configStatus"></div>
      </div>
    </div>

    <!-- Token 获取面板 -->
    <div class="config-section">
      <div class="config-toggle" id="tokenFetchToggle">
        <span>🔑 从后台获取 Token</span>
        <span class="arrow">▶</span>
      </div>
      <div class="config-body" id="tokenFetchBody" style="display:none;">
        <p style="font-size:12px;color:#64748b;margin-bottom:10px;line-height:1.5;">
          确保已在浏览器中打开并登录了 <strong>https://heharse.cloud</strong> 管理后台
        </p>
        <button class="btn btn-primary" id="fetchTokenBtn2" style="width:100%;">🔄 一键获取 Token</button>
        <div class="status" id="tokenFetchStatus"></div>
      </div>
    </div>

    <!-- 批量统计栏 -->
    <div class="batch-stats" id="batchStats" style="display:none;">
      <span>📦 共 <strong id="totalCount">0</strong> 条</span>
      <span class="sep">|</span>
      <span>✅ <strong id="submittedCount">0</strong> 已提交</span>
      <span class="sep">|</span>
      <span>⏳ <strong id="pendingCount">0</strong> 待提交</span>
    </div>

    <!-- 批量操作栏 -->
    <div class="batch-actions-bar" id="batchActionsBar" style="display:none;">
      <label class="check-all">
        <input type="checkbox" id="checkAll"> 全选
      </label>
      <div class="batch-btns">
        <button class="btn btn-primary btn-sm" id="batchSubmitBtn">
          <span class="btn-icon">⬆️</span> 批量提交
        </button>
        <button class="btn btn-ghost btn-sm" id="clearSubmittedBtn">清空已提交</button>
        <button class="btn btn-danger btn-sm" id="clearAllBtn">全部清空</button>
      </div>
    </div>

    <!-- 采集列表 -->
    <div class="batch-list" id="batchList">
      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <p>暂无采集的数据</p>
        <p class="hint">在 opennana.com 点击「采集」按钮<br>内容会实时追加到这里</p>
      </div>
    </div>

    <!-- 单条编辑弹窗（内联展开） -->
    <div class="edit-panel" id="editPanel" style="display:none;">
      <div class="edit-panel-header">
        <span>✏️ 编辑提示词</span>
        <button class="btn-close" id="closeEditPanel">✕</button>
      </div>
      <div class="edit-panel-body">
        <input type="hidden" id="editId">
        <div class="field">
          <label>标题 <span class="required">*</span></label>
          <input type="text" id="editTitle" placeholder="提示词标题">
        </div>
        <div class="field">
          <label>Prompt 内容（中文）<span class="required">*</span></label>
          <textarea id="editContent" placeholder="中文提示词正文..." rows="3"></textarea>
        </div>
        <div class="field">
          <label>Prompt 内容（英文）</label>
          <textarea id="editContentEn" placeholder="英文提示词正文..." rows="3"></textarea>
        </div>
        <div class="field-row">
          <div class="field half">
            <label>模型</label>
            <input type="text" id="editModel" placeholder="如: GPT-4o">
          </div>
          <div class="field half">
            <label>来源平台</label>
            <input type="text" id="editSource" placeholder="如: opennana">
          </div>
        </div>
        <div class="field-row">
          <div class="field half">
            <label>媒体类型</label>
            <select id="editMediaType">
              <option value="image">图片</option>
              <option value="video">视频</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label>标签（逗号分隔，可选）</label>
          <input type="text" id="editTags" placeholder="标签1, 标签2, 标签3">
        </div>
        <div class="field">
          <label>分类 ID</label>
          <input type="number" id="editCategoryId" placeholder="从 new-api 获取的分类 ID">
        </div>
        <div class="field">
          <label>封面图 URL</label>
          <input type="text" id="editCoverImage" placeholder="https://...">
        </div>
        <div class="field">
          <label>视频 URL</label>
          <input type="text" id="editVideoUrl" placeholder="https://...">
        </div>
        <div class="field">
          <label>来源链接</label>
          <input type="text" id="editSourceUrl" readonly>
        </div>
        <div class="edit-actions">
          <button class="btn btn-primary" id="saveEditBtn">保存修改</button>
          <button class="btn btn-ghost" id="cancelEditBtn">取消</button>
        </div>
      </div>
    </div>

    <!-- 全局状态提示 -->
    <div class="status" id="globalStatus"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
